openapi: "3.1.1"
info:
  title: Signer API
  version: "0.2.0"
  description: |
    API that allows commit modules to request generic signatures from validators.

    ## Authentication

    All endpoints (except `/status`) require a Bearer JWT in the `Authorization` header.
    A missing or malformed `Authorization` header returns `400`, not `401`.

    ### Module JWT claims

    HS256-signed token with the module's pre-shared secret (`CB_SIGNER_JWT` env var):

    - **module** (string, required): Module `id` from `[[modules]]` in `cb-config.toml`.
    - **route** (string, required): Exact request path, e.g. `/signer/v1/get_pubkeys`.
    - **exp** (integer, required): UNIX expiry timestamp. The SDK issues tokens with a 5-minute expiry; the server only validates that the token is unexpired.
    - **payload_hash** (string, POST only): Keccak-256 hash of the JSON request body, `0x`-prefixed. Prevents JWT replay attacks.

    Refresh is client-side: the module generates a new JWT locally. No refresh endpoint.

    ### Admin JWT

    Admin endpoints (`/reload`, `/revoke_jwt`) use a separate HS256 secret (`CB_SIGNER_ADMIN_JWT` env var) with the following claims:

    - **admin** (boolean, required): Must be `true`.
    - **route** (string, required): Exact request path, `/reload` or `/revoke_jwt`.
    - **exp** (integer, required): UNIX expiry timestamp.
    - **payload_hash** (string, required): Keccak-256 hash of the JSON request body, `0x`-prefixed. Both admin endpoints require a JSON body, so this claim is required in practice.

    ### Rate limiting

    Per-IP rate limit on JWT auth failures. Default: 3 failures within 5 minutes. Configurable via `[signer].jwt_auth_fail_limit` and `jwt_auth_fail_timeout_seconds` in `cb-config.toml`.
tags:
  - name: Signer
  - name: Management
paths:
  /signer/v1/get_pubkeys:
    get:
      summary: Get a list of public keys for which signatures may be requested
      description: |
        Requires a module JWT (see Authentication above); the `route` claim must be `/signer/v1/get_pubkeys`.
      tags:
        - Signer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "All public keys available to the module: consensus pubkeys (BLS) and proxies (BLS pubkeys and ECDSA addresses)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    description: List of mappings between consensus pubkeys and their proxies
                    type: array
                    items:
                      type: object
                      properties:
                        consensus:
                          description: Consensus validator pubkey
                          $ref: "#/components/schemas/BlsPubkey"
                        proxy_bls:
                          description: BLS proxy pubkeys
                          type: array
                          items:
                            $ref: "#/components/schemas/BlsPubkey"
                        proxy_ecdsa:
                          description: ECDSA proxy addresses
                          type: array
                          items:
                            $ref: "#/components/schemas/EcdsaAddress"
        "400":
          description: The request did not include a valid `Authorization` header with a Bearer token, or the client IP could not be determined.
          content:
            text/plain:
              schema:
                type: string
                example: "Header of type `authorization` was missing"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /signer/v1/request_signature/bls:
    post:
      summary: Request a signature for a 32-byte blob of data (typically a hash), signed by the BLS private key for the requested public key.
      description: |
        Requires a module JWT (see Authentication above); the `route` claim must be `/signer/v1/request_signature/bls`.
      tags:
        - Signer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, object_root, nonce]
              properties:
                pubkey:
                  description: The consensus (proposer) pubkey to sign with.
                  $ref: "#/components/schemas/BlsPubkey"
                object_root:
                  description: The 32-byte digest to sign.
                  $ref: "#/components/schemas/B256"
                nonce:
                  $ref: "#/components/schemas/Nonce"
            example:
              pubkey: "0xa3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989"
              object_root: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
              nonce: 1
      responses:
        "200":
          description: A successful signature response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlsSignatureResponse"
              example:
                pubkey: "0x883827193f7627cd04e621e1e8d56498362a52b2a30c9a1c72036eb935c4278dee23d38a24d2f7dda62689886f0c39f4"
                object_root: "0x0123456789012345678901234567890123456789012345678901234567890123"
                module_signing_id: "0x6a33a23ef26a4836979edff86c493a69b26ccf0b4a16491a815a13787657431b"
                nonce: 1
                chain_id: "0x1"
                signature: "0xa43e623f009e615faa3987368f64d6286a4103de70e9a81d82562c50c91eae2d5d6fb9db9fe943aa8ee42fd92d8210c1149f25ed6aa72a557d74a0ed5646fdd0e8255ec58e3e2931695fe913863ba0cdf90d29f651bce0a34169a6f6ce5b3115"
        "400":
          description: |
            This can occur in several scenarios:
            - The request did not include a valid `Authorization` header with a Bearer token.
            - The Commit-Boost configuration file does not contain a signing ID for the module that made the request.
            - Something went wrong while preparing your request; the error text will provide more information.
          content:
            text/plain:
              schema:
                type: string
                example: "bad request: Module signing ID not found"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"

        "404":
          description: You either requested a route that doesn't exist, or you requested a signature from a key that does not exist.
          content:
            text/plain:
              schema:
                type: string
                example: "unknown consensus signer: 0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DirkUnreachable"

  /signer/v1/request_signature/proxy-bls:
    post:
      summary: Request a signature for a 32-byte blob of data (typically a hash), signed by the BLS private key for the requested proxy public key.
      description: |
        Requires a module JWT (see Authentication above); the `route` claim must be `/signer/v1/request_signature/proxy-bls`.
      tags:
        - Signer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proxy, object_root, nonce]
              properties:
                proxy:
                  description: The proxy pubkey to sign with.
                  $ref: "#/components/schemas/BlsPubkey"
                object_root:
                  description: The 32-byte digest to sign.
                  $ref: "#/components/schemas/B256"
                nonce:
                  $ref: "#/components/schemas/Nonce"
            example:
              proxy: "0xa3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989"
              object_root: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
              nonce: 1
      responses:
        "200":
          description: A successful signature response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlsSignatureResponse"
              example:
                pubkey: "0x883827193f7627cd04e621e1e8d56498362a52b2a30c9a1c72036eb935c4278dee23d38a24d2f7dda62689886f0c39f4"
                object_root: "0x0123456789012345678901234567890123456789012345678901234567890123"
                module_signing_id: "0x6a33a23ef26a4836979edff86c493a69b26ccf0b4a16491a815a13787657431b"
                nonce: 1
                chain_id: "0x1"
                signature: "0xa43e623f009e615faa3987368f64d6286a4103de70e9a81d82562c50c91eae2d5d6fb9db9fe943aa8ee42fd92d8210c1149f25ed6aa72a557d74a0ed5646fdd0e8255ec58e3e2931695fe913863ba0cdf90d29f651bce0a34169a6f6ce5b3115"
        "400":
          description: |
            This can occur in several scenarios:
            - The request did not include a valid `Authorization` header with a Bearer token.
            - The Commit-Boost configuration file does not contain a signing ID for the module that made the request.
            - Something went wrong while preparing your request; the error text will provide more information.
          content:
            text/plain:
              schema:
                type: string
                example: "bad request: Module signing ID not found"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"

        "404":
          description: You either requested a route that doesn't exist, or you requested a signature from a key that does not exist.
          content:
            text/plain:
              schema:
                type: string
                example: "unknown proxy signer: 0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DirkUnreachable"

  /signer/v1/request_signature/proxy-ecdsa:
    post:
      summary: Request a signature for a 32-byte blob of data (typically a hash), signed by the ECDSA private key for the requested proxy Ethereum address.
      description: |
        Requires a module JWT (see Authentication above); the `route` claim must be `/signer/v1/request_signature/proxy-ecdsa`.
      tags:
        - Signer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proxy, object_root, nonce]
              properties:
                proxy:
                  description: The proxy address to sign with.
                  $ref: "#/components/schemas/EcdsaAddress"
                object_root:
                  description: The 32-byte digest to sign.
                  $ref: "#/components/schemas/B256"
                nonce:
                  $ref: "#/components/schemas/Nonce"
            example:
              proxy: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
              object_root: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
              nonce: 1
      responses:
        "200":
          description: A successful signature response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcdsaSignatureResponse"
              example:
                address: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
                object_root: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
                module_signing_id: "0x6a33a23ef26a4836979edff86c493a69b26ccf0b4a16491a815a13787657431b"
                nonce: 1
                chain_id: "0x1"
                signature: "0x985b495f49d1b96db3bba3f6c5dd1810950317c10d4c2042bd316f338cdbe74359072e209b85e56ac492092d7860063dd096ca31b4e164ef27e3f8d508e656801c"
        "400":
          description: |
            This can occur in several scenarios:
            - The request did not include a valid `Authorization` header with a Bearer token.
            - The Commit-Boost configuration file does not contain a signing ID for the module that made the request.
            - You requested an operation while using the Dirk signer mode instead of locally-managed signer mode, but Dirk doesn't support that operation.
            - Something went wrong while preparing your request; the error text will provide more information.
          content:
            text/plain:
              schema:
                type: string
                example: "Dirk signer does not support this operation"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"

        "404":
          description: You either requested a route that doesn't exist, or you requested a signature from a key that does not exist.
          content:
            text/plain:
              schema:
                type: string
                example: "unknown proxy signer: 0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /signer/v1/generate_proxy_key:
    post:
      summary: Request a proxy key be generated for a specific consensus pubkey
      description: |
        Requires a module JWT (see Authentication above); the `route` claim must be `/signer/v1/generate_proxy_key`.
      tags:
        - Signer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, scheme]
              properties:
                pubkey:
                  description: a validator BLS public key for which to generate a proxy key
                  allOf:
                    - $ref: "#/components/schemas/BlsPubkey"
                scheme:
                  description: signature scheme to generate proxy keypair for
                  type: string
                  enum: [bls, ecdsa]
            examples:
              Bls:
                value:
                  pubkey: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                  scheme: "bls"
              Ecdsa:
                value:
                  pubkey: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                  scheme: "ecdsa"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      delegator:
                        description: the validator BLS public key for which the proxy key was generated (the same one as requested)
                        allOf:
                          - $ref: "#/components/schemas/BlsPubkey"
                      proxy:
                        description: the generated proxy identifier (BLS pubkey or ECDSA address)
                        oneOf:
                          - $ref: "#/components/schemas/BlsPubkey"
                          - $ref: "#/components/schemas/EcdsaAddress"
                  signature:
                    description: The signature of the proxy delegation
                    allOf:
                      - $ref: "#/components/schemas/BlsSignature"
              examples:
                Bls:
                  value:
                    message:
                      delegator: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                      proxy: "0xb646318d81b7cff3f8aae5040eab11927b4a99542c02970a1ab8069a83e5b76b302705d0b5e0054831ce2af72088bf30"
                    signature: "0x88274f2d78d30ae429cc16f5c64657b491ccf26291c821cf953da34f16d60947d4f245decdce4a492e8d8f949482051b184aaa890d5dd97788387689335a1fee37cbe55c0227f81b073ce6e93b45f96169f497ed322d3d384d79ccaa7846d5ab"
                Ecdsa:
                  value:
                    message:
                      delegator: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                      proxy: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
                    signature: "0xb5b5b71d1701cc45086af3d3d86bf9d3c509442835e5b9f7734923edc9a6c538e743d70613cdef90b7e5b171fbbe6a29075b3f155e4bd66d81ff9dbc3b6d7fa677d169b2ceab727ffa079a31fe1fc0e478752e9da9566a9408e4db24ac6104db"
        "400":
          description: |
            This can occur in several scenarios:
            - The request did not include a valid `Authorization` header with a Bearer token.
            - You requested an ECDSA proxy key while using the Dirk signer mode, but Dirk only supports BLS operations.
            - Something went wrong while preparing your request; the error text will provide more information.
          content:
            text/plain:
              schema:
                type: string
                example: "Dirk signer does not support this operation"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"
        "404":
          description: Unknown value (pubkey, etc.)
          content:
            text/plain:
              schema:
                type: string
                example: "unknown consensus signer: 0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DirkUnreachable"

  /reload:
    post:
      summary: Hot-reload signer configuration
      description: |
        Re-reads cb-config.toml and environment variables, rebuilding the signer's
        internal state. Accepts optional body overrides for JWT secrets and the
        admin secret.

        **Behavior:**
        - New modules in config are registered.
        - Removed modules are dropped from the access list.
        - JWT secrets and admin secret are reset to env var values.
        - Previous runtime changes (from /revoke_jwt or body overrides) are reverted.

        **Body overrides** (applied on top of the config baseline):
        - `jwt_secrets`: comma-separated `<MODULE_ID>=<SECRET>` pairs.
        - `admin_secret`: string to override the admin JWT secret.

        Body overrides are **not persisted** across restarts.

        A JSON body with `Content-Type: application/json` is required even when no
        overrides are sent; send an empty object `{}`.
      tags:
        - Management
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jwt_secrets:
                  description: Comma-separated list of MODULE_ID=SECRET pairs to override module JWT secrets
                  type: string
                  example: "module_a=newsecret,module_b=anothersecret"
                admin_secret:
                  description: Override for the admin JWT secret
                  type: string
                  example: "my-new-admin-secret"
      responses:
        "200":
          description: Configuration reloaded successfully
        "400":
          description: The body references a module ID not present in the config, or the request did not include a valid `Authorization` header with a Bearer token.
          content:
            text/plain:
              schema:
                type: string
                example: "bad request: Module unknown-module not found in config, cannot override JWT secret"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Failed to reload config (previous state preserved)
          content:
            text/plain:
              schema:
                type: string
                example: "internal error"

  /revoke_jwt:
    post:
      summary: Immediately revoke a module's access
      description: |
        Removes a module from the signer's access list. The module will no longer
        be able to authenticate with its JWT.

        If the module is still present in cb-config.toml, the next `/reload` will
        re-add it. Remove the module from the config to make revocation permanent.
      tags:
        - Management
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - module_id
              properties:
                module_id:
                  description: The ID of the module to revoke
                  type: string
                  example: "MY_MODULE"
      responses:
        "200":
          description: Module access revoked successfully
        "400":
          description: The request did not include a valid `Authorization` header with a Bearer token.
          content:
            text/plain:
              schema:
                type: string
                example: "Header of type `authorization` was missing"
        "401":
          $ref: "#/components/responses/UnauthorizedJwt"
        "404":
          description: Module ID not found
          content:
            text/plain:
              schema:
                type: string
                example: "module id not found"
        "422":
          $ref: "#/components/responses/DeserializationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /status:
    get:
      summary: Health check
      description: Simple health check endpoint. Returns 200 OK with no body. No authentication required.
      tags:
        - Management
      responses:
        "200":
          description: Signer service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ""

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedJwt:
      description: The JWT provided in the request's authorization header was invalid. For example, it was expired, signed with the wrong secret, or its claims did not match the request.
      content:
        text/plain:
          schema:
            type: string
            example: "unauthorized"
    RateLimited:
      description: Your client IP failed JWT authentication too many times recently, and is currently timed out. It cannot make any more requests until the timeout ends.
      content:
        text/plain:
          schema:
            type: string
            example: "rate limited for 12.3"
    DeserializationFailed:
      description: The request body could not be deserialized. For example, a field was not valid hex of the expected length.
      content:
        text/plain:
          schema:
            type: string
            example: "Failed to deserialize the JSON body into the target type"
    InternalError:
      description: Internal server error. The request was valid but could not be fulfilled.
      content:
        text/plain:
          schema:
            type: string
            example: "internal error"
    DirkUnreachable:
      description: The signer service is running in Dirk signer mode, but Dirk could not be reached.
      content:
        text/plain:
          schema:
            type: string
            example: "Dirk communication error"
  schemas:
    B256:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{64}$"
      example: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
    BlsPubkey:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{96}$"
      example: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
    EcdsaAddress:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{40}$"
      example: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
    BlsSignature:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{192}$"
      example: "0xa3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989a3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989"
    EcdsaSignature:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{130}$"
      example: "0x985b495f49d1b96db3bba3f6c5dd1810950317c10d4c2042bd316f338cdbe74359072e209b85e56ac492092d7860063dd096ca31b4e164ef27e3f8d508e656801c"
    BlsSignatureResponse:
      type: object
      properties:
        pubkey:
          description: The BLS public key corresponding to the private key that was used to sign the request
          $ref: "#/components/schemas/BlsPubkey"
        object_root:
          description: The 32-byte data that was signed, with `0x` prefix
          $ref: "#/components/schemas/B256"
        module_signing_id:
          description: The signing ID of the module that requested the signature, as specified in the Commit-Boost configuration
          $ref: "#/components/schemas/B256"
        nonce:
          $ref: "#/components/schemas/Nonce"
        chain_id:
          description: The chain ID that the signature is valid for, as specified in the Commit-Boost configuration. Serialized as a `0x`-prefixed hex quantity string.
          type: string
          format: hex
          example: "0x1"
        signature:
          description: The BLS signature of the SSZ root over the provided `object_root`, the module's signing ID, the nonce, and the chain ID (`PropCommitSigningInfo`), domain-separated per the [signature structure documentation](https://commit-boost.github.io/commit-boost-client/developing/prop-commit-signing#structure-of-a-signature).
          $ref: "#/components/schemas/BlsSignature"
    EcdsaSignatureResponse:
      type: object
      properties:
        address:
          description: The ECDSA address corresponding to the private key that was used to sign the request
          $ref: "#/components/schemas/EcdsaAddress"
        object_root:
          description: The 32-byte data that was signed, with `0x` prefix
          $ref: "#/components/schemas/B256"
        module_signing_id:
          description: The signing ID of the module that requested the signature, as specified in the Commit-Boost configuration
          $ref: "#/components/schemas/B256"
        nonce:
          $ref: "#/components/schemas/Nonce"
        chain_id:
          description: The chain ID that the signature is valid for, as specified in the Commit-Boost configuration. Serialized as a `0x`-prefixed hex quantity string.
          type: string
          format: hex
          example: "0x1"
        signature:
          description: The ECDSA signature (in Ethereum RSV format) of the SSZ root over the provided `object_root`, the module's signing ID, the nonce, and the chain ID (`PropCommitSigningInfo`), domain-separated per the [signature structure documentation](https://commit-boost.github.io/commit-boost-client/developing/prop-commit-signing#structure-of-a-signature).
          $ref: "#/components/schemas/EcdsaSignature"
    Nonce:
      type: integer
      description: |
        Replay-protection nonce, always mixed into the signing root via `PropCommitSigningInfo`. It
        is an unsigned 64-bit integer. Per the [EIP-2681](https://eips.ethereum.org/EIPS/eip-2681)
        convention the maximum is 2^64-2 (18446744073709551614), but the service does not enforce
        this cap.

        Modules that track nonces for replay protection should use a monotonically increasing value
        per key. Modules that do not use replay protection should always send `0`.
      minimum: 0
      maximum: 18446744073709551615
      example: 1
