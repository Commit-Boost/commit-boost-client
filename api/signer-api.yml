  /signer/v1/generate_proxy_key:
    post:
      summary: Request a proxy key be generated for a specific consensus pubkey
      description: |
        This endpoint requires a valid JWT Bearer token.

        The token **must include** the following claims:
        - `exp` (integer): Expiration timestamp
        - `module` (string): The ID of the module making the request, which must match a module ID in the Commit-Boost configuration file.
        - `route` (string): The route being requested (must be `/signer/v1/generate_proxy_key` for this endpoint).
        - `payload_hash` (string): The Keccak-256 hash of the JSON-encoded request body, with optional `0x` prefix. This is required to prevent JWT replay attacks.
      tags:
        - Signer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, scheme]
              properties:
                pubkey:
                  description: a validator BLS public key for which to generate a proxy key
                  allOf:
                    - $ref: "#/components/schemas/BlsPubkey"
                scheme:
                  description: signature scheme to generate proxy keypair for
                  type: string
                  enum: [bls, ecdsa]
            examples:
              Bls:
                value:
                  pubkey: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                  scheme: "bls"
              Ecdsa:
                value:
                  pubkey: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                  scheme: "ecdsa"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      delegator:
                        description: the validator BLS public key for which the proxy key was generated (the same one as requested)
                        allOf:
                          - $ref: "#/components/schemas/BlsPubkey"
                      proxy:
                        description: the generated proxy identifier (BLS pubkey or ECDSA address)
                        oneOf:
                          - $ref: "#/components/schemas/BlsPubkey"
                          - $ref: "#/components/schemas/EcdsaAddress"
                  signature:
                    description: The signature of the proxy delegation
                    allOf:
                      - $ref: "#/components/schemas/BlsSignature"
              examples:
                Bls:
                  value:
                    message:
                      delegator: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                      proxy: "0xb646318d81b7cff3f8aae5040eab11927b4a99542c02970a1ab8069a83e5b76b302705d0b5e0054831ce2af72088bf30"
                    signature: "0x88274f2d78d30ae429cc16f5c64657b491ccf26291c821cf953da34f16d60947d4f245decdce4a492e8d8f949482051b184aaa890d5dd97788387689335a1fee37cbe55c0227f81b073ce6e93b45f96169f497ed322d3d384d79ccaa7846d5ab"
                Ecdsa:
                  value:
                    message:
                      delegator: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
                      proxy: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
                    signature: "0xb5b5b71d1701cc45086af3d3d86bf9d3c509442835e5b9f7734923edc9a6c538e743d70613cdef90b7e5b171fbbe6a29075b3f155e4bd66d81ff9dbc3b6d7fa677d169b2ceab727ffa079a31fe1fc0e478752e9da9566a9408e4db24ac6104db"
        "404":
          description: Unknown value (pubkey, etc.)
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: "Unknown pubkey"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: "Internal error"

  /reload:
    post:
      summary: Hot-reload signer configuration
      description: |
        Re-reads cb-config.toml and environment variables, rebuilding the signer's
        internal state. Accepts optional body overrides for JWT secrets and the
        admin secret.

        **Behaviour:**
        - New modules in config are registered.
        - Removed modules are dropped from the access list.
        - JWT secrets and admin secret are reset to env var values.
        - Previous runtime changes (from /revoke_jwt or body overrides) are reverted.

        **Body overrides** (applied on top of the config baseline):
        - `jwt_secrets`: comma-separated `<MODULE_ID>=<SECRET>` pairs.
        - `admin_secret`: string to override the admin JWT secret.

        Body overrides are **not persisted** across restarts.
      tags:
        - Management
      security:
        - AdminBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jwt_secrets:
                  description: Comma-separated list of MODULE_ID=SECRET pairs to override module JWT secrets
                  type: string
                  example: "module_a=newsecret,module_b=anothersecret"
                admin_secret:
                  description: Override for the admin JWT secret
                  type: string
                  example: "my-new-admin-secret"
      responses:
        "200":
          description: Configuration reloaded successfully
        "400":
          description: Body references a module ID not present in the config
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: number
                    example: 400
                  message:
                    type: string
                    example: "bad request: Module unknown-module not found in config, cannot override JWT secret"
        "500":
          description: Failed to reload config (previous state preserved)
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: "internal error: failed to reload config"

  /revoke_jwt:
    post:
      summary: Immediately revoke a module's access
      description: |
        Removes a module from the signer's access list. The module will no longer
        be able to authenticate with its JWT.

        If the module is still present in cb-config.toml, the next `/reload` will
        re-add it. Remove the module from the config to make revocation permanent.
      tags:
        - Management
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - module_id
              properties:
                module_id:
                  description: The ID of the module to revoke
                  type: string
                  example: "MY_MODULE"
      responses:
        "200":
          description: Module access revoked successfully
        "404":
          description: Module ID not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: number
                    example: 404
                  message:
                    type: string
                    example: "module id not found"

  /status:
    get:
      summary: Health check
      description: Simple health check endpoint. Returns 200 OK with no body. No authentication required.
      tags:
        - Management
      responses:
        "200":
          description: Signer service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ""

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    B256:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{64}$"
      example: "0x3e9f4a78b5c21d64f0b8e3d9a7f5c02b4d1e67a3c8f29b5d6e4a3b1c8f72e6d9"
    BlsPubkey:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{96}$"
      example: "0xa9e9cff900de07e295a044789fd4bdb6785eb0651ad282f9e76d12afd87e75180bdd64caf2e315b815d7322bd31ab48a"
    EcdsaAddress:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{40}$"
      example: "0x71f65e9f6336770e22d148bd5e89b391a1c3b0bb"
    BlsSignature:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{192}$"
      example: "0xa3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989a3ffa9241f78279f1af04644cb8c79c2d8f02bcf0e28e2f186f6dcccac0a869c2be441fda50f0dea895cfce2e53f0989"
    EcdsaSignature:
      type: string
      format: hex
      pattern: "^0x[a-fA-F0-9]{130}$"
      example: "0x985b495f49d1b96db3bba3f6c5dd1810950317c10d4c2042bd316f338cdbe74359072e209b85e56ac492092d7860063dd096ca31b4e164ef27e3f8d508e656801c"
    BlsSignatureResponse:
      type: object
      properties:
        pubkey:
          description: The BLS public key corresponding to the private key that was used to sign the request
          $ref: "#/components/schemas/BlsPubkey"
        object_root:
          description: The 32-byte data that was signed, with `0x` prefix
          $ref: "#/components/schemas/B256"
        module_signing_id:
          description: The signing ID of the module that requested the signature, as specified in the Commit-Boost configuration
          $ref: "#/components/schemas/B256"
        nonce:
          $ref: "#/components/schemas/Nonce"
        chain_id:
          description: The chain ID that the signature is valid for, as specified in the Commit-Boost configuration
          type: integer
          example: 1
        signature:
          description: The BLS signature of the Merkle root hash of the provided `object_root` field and the requesting module's Signing ID. For details on this signature, see the [signature structure documentation](https://commit-boost.github.io/commit-boost-client/developing/prop-commit-signing.md#structure-of-a-signature).
          $ref: "#/components/schemas/BlsSignature"
    EcdsaSignatureResponse:
      type: object
      properties:
        address:
          description: The ECDSA address corresponding to the private key that was used to sign the request
          $ref: "#/components/schemas/EcdsaAddress"
        object_root:
          description: The 32-byte data that was signed, with `0x` prefix
          $ref: "#/components/schemas/B256"
        module_signing_id:
          description: The signing ID of the module that requested the signature, as specified in the Commit-Boost configuration
          $ref: "#/components/schemas/B256"
        nonce:
          $ref: "#/components/schemas/Nonce"
        chain_id:
          description: The chain ID that the signature is valid for, as specified in the Commit-Boost configuration
          type: integer
          example: 1
        signature:
          description: The ECDSA signature (in Ethereum RSV format) of the Merkle root hash of the provided `object_root` field and the requesting module's Signing ID. For details on this signature, see the [signature structure documentation](https://commit-boost.github.io/commit-boost-client/developing/prop-commit-signing.md#structure-of-a-signature).
          $ref: "#/components/schemas/EcdsaSignature"
    Nonce:
      type: integer
      description: |
        Replay-protection nonce, always mixed into the signing root via `PropCommitSigningInfo`. It
        must be an unsigned 64-bit integer between 0 and 2^64-2 (18446744073709551614), inclusive.

        Modules that track nonces for replay protection should use a monotonically increasing value
        per key. Modules that do not use replay protection should always send `0`.
      minimum: 0
      maximum: 18446744073709551614
      example: 1
